name: Build iOS IPA

on:
  push:
    branches: [main, redesign/darkroom-studio]
    paths:
      - LivePhotoPreserve/**
      - LivePhotoPreserve.xcodeproj/**
      - LivePhotoPreserve.xcconfig
      - .github/workflows/build-ipa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build for iPhone and iPad
        run: |
          xcode_app="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$xcode_app" ]; then
            export DEVELOPER_DIR="$xcode_app/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild \
            -project LivePhotoPreserve.xcodeproj \
            -scheme LivePhotoPreserve \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/livephoto-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          app="$RUNNER_TEMP/livephoto-build/Build/Products/Release-iphoneos/LivePhotoPreserve.app"
          executable=$(plutil -extract CFBundleExecutable raw "$app/Info.plist")
          xcrun lipo "$app/$executable" -verify_arch arm64

          package="$RUNNER_TEMP/livephoto-package"
          mkdir -p "$package/Payload"
          ditto "$app" "$package/Payload/LivePhotoPreserve.app"
          ipa="$package/LivePhotoPro-unsigned.ipa"
          ditto -c -k --keepParent "$package/Payload" "$ipa"
          unzip -tq "$ipa"
          shasum -a 256 "$ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LivePhotoPro-unsigned-ipa
          path: ${{ runner.temp }}/livephoto-package/LivePhotoPro-unsigned.ipa
          if-no-files-found: error
